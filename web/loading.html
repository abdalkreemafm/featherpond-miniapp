<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="pond-api-base" content="">
  <meta name="manus-game-loading-screen" content="1">
  <meta name="theme-color" content="#0b5755">
  <link rel="icon" href="index.icon.png" type="image/png">
  <title>$GODOT_PROJECT_NAME</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  $GODOT_HEAD_INCLUDE
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans Arabic", sans-serif; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b5755; color: #fff5df; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading {
      position: fixed; inset: 0; z-index: 5; box-sizing: border-box; display: grid;
      align-content: center; justify-items: center; gap: 14px; padding: max(24px, env(safe-area-inset-top)) 24px max(30px, env(safe-area-inset-bottom));
      background: linear-gradient(160deg, #0b5755, #123b3b 70%, #173a35); color: #fff5df; text-align: center;
    }
    #loading[hidden], [hidden] { display: none; }
    #loading > * { max-width: min(520px, 100%); }
    #loading h1 { margin: 0; font-size: clamp(26px, 7vw, 42px); line-height: 1.2; }
    #loading p { margin: 0; line-height: 1.6; }
    #loading progress { width: min(340px, 78vw); height: 9px; border: 0; border-radius: 99px; overflow: hidden; accent-color: #b7e7c3; background: #ffffff30; }
    #loading progress::-webkit-progress-bar { background: #ffffff30; border-radius: 99px; }
    #loading progress::-webkit-progress-value { background: #b7e7c3; border-radius: 99px; }
    #loading progress::-moz-progress-bar { background: #b7e7c3; border-radius: 99px; }
    #loading button { min-height: 48px; padding: 8px 24px; border: 1px solid #d9e8bd; border-radius: 14px; background: #b7e7c3; color: #123b3b; font: inherit; font-weight: 700; cursor: pointer; }
    #loading button:focus-visible { outline: 3px solid #fff5df; outline-offset: 4px; }
    #loading-notice { max-width: 360px; }
    @media (max-height: 520px) { #loading { align-content: center; gap: 8px; padding: 12px 20px; } #loading h1 { font-size: clamp(22px, 5vh, 32px); } }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">متصفحك لا يدعم لوحة اللعبة.</canvas>
  <section id="loading" role="status" aria-live="polite">
    <h1 id="game-title">بركة الريش</h1>
    <p id="loading-status">جارٍ تحميل اللعبة…</p>
    <progress id="loading-progress" aria-label="تقدم التحميل"></progress>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>إعادة المحاولة</button>
    <noscript>تحتاج اللعبة إلى تفعيل JavaScript.</noscript>
  </section>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      const telegram = window.Telegram && window.Telegram.WebApp;
      const apiMeta = document.querySelector('meta[name="pond-api-base"]');
      const configuredApi = apiMeta ? apiMeta.content.trim() : '';
      window.PondBridge = {
        apiBase: (configuredApi || window.location.origin).replace(/\/+$/, ''),
        getInitData: () => telegram && telegram.initData ? telegram.initData : '',
        ready: () => {
          try { if (telegram) { telegram.ready(); telegram.expand(); } } catch (_) {}
        },
        haptic: (kind) => {
          try {
            const feedback = telegram && telegram.HapticFeedback;
            if (!feedback) return;
            if (kind === 'success') feedback.notificationOccurred('success');
            else feedback.impactOccurred(kind === 'selection' ? 'soft' : 'light');
          } catch (_) {}
        },
        share: (url) => {
          const text = 'تعال إلى بركة الريش واعتنِ بقطيع البط معي!';
          try {
            if (telegram && telegram.openTelegramLink) {
              telegram.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text));
              return;
            }
            if (navigator.share) { navigator.share({ title: 'بركة الريش', text, url }).catch(() => {}); return; }
            if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
          } catch (_) {}
        }
      };
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
      status.textContent = 'جارٍ تحميل اللعبة…';
      retry.textContent = 'إعادة المحاولة';
      progress.setAttribute('aria-label', 'تقدم التحميل');
      retry.addEventListener('click', () => window.location.reload());

      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        notice.textContent = performance.now() - lastProgressAt >= 30000
          ? 'لم يظهر تقدم جديد في التحميل. يمكنك الانتظار أو إعادة المحاولة.'
          : 'ما زالت اللعبة قيد التحميل. يمكنك الانتظار أو إعادة المحاولة.';
      };
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[pond-loading] تعذر بدء اللعبة', error);
        loading.hidden = false;
        status.textContent = 'تعذر تحميل اللعبة. تحقق من الاتصال ثم أعد المحاولة.';
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = 'جارٍ تحميل اللعبة…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total ? 'جارٍ تشغيل اللعبة…' : `${Math.floor(current / total * 100)}٪`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) { fail(error); }
      };
      start();
    })();
  </script>
</body>
</html>
