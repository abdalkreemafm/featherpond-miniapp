# أدرج هذا المقطع داخل خادم HTTPS للنطاق الذي سجلته كتطبيق Telegram.
# شهادة TLS تُدار في خادم Nginx/موزّعك الحالي؛ لا تضع BOT_TOKEN هنا.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20k;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/wasm text/css application/json;
}
